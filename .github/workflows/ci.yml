name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract OCR
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: OCR must be available here (so the OCR test cannot be skipped)
        run: python -c "from rag.ocr import ocr_available, tessdata_path; assert ocr_available(), 'no OCR'; print('tessdata:', tessdata_path())"
      - name: Run pytest
        run: pytest -rs
      - name: Web demo library matches the samples and the real chunker
        run: python tools/make_demo_data.py --check
      - name: Local demo environment starts, serves and stops
        run: |
          python scripts/demo.py up
          python scripts/demo.py status
          python scripts/demo.py verify
          python scripts/demo.py down
      - name: Demo logs on failure
        if: failure()
        run: tail -n 100 .demo/logs/*.log || true

  # The static demo published at yappertech.com/legal-ai-demo (web/). Its build is
  # what the YapperTech site copies in, so a red run here means a broken deploy.
  web-demo:
    name: Web demo (${{ matrix.browser }})
    # Pinned, not ubuntu-latest: Playwright only installs browsers on the Ubuntu
    # releases it was built for, so a runner-image bump would fail every run.
    # Move this together with the playwright@ version below.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]   # webkit = Safari's engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: JavaScript parses
        run: |
          for f in web/js/*.js web/js/engine/*.js tools/*.mjs; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: Engine self-test (retrieval, citations, key terms match the Python extractor)
        run: node tools/selftest.mjs
      - name: Site build
        run: bash tools/build-site.sh
      - name: Browser end-to-end in ${{ matrix.browser }}
        run: |
          npm i --no-save --silent playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
          node tools/e2e.mjs --browser ${{ matrix.browser }}

  docker:
    name: Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Prepare .env and inbox
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          # The container runs as uid 1000; make the bind-mounted inbox writable for it.
          mkdir -p inbox && chmod 777 inbox
      - name: Validate compose file
        run: docker compose --profile llm --profile automation config --quiet
      - name: Build image
        run: docker compose build
      - name: Start API and UI (waits for healthchecks)
        run: docker compose up -d --wait --wait-timeout 300
      - name: Check endpoints
        run: |
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"chromadb":"healthy"'
          curl -fsS http://127.0.0.1:8501/_stcore/health
      - name: Seed demo data and ask a question (extractive mode)
        run: |
          pip install requests
          python scripts/seed_demo.py --backend http://127.0.0.1:8000
          python scripts/ci_check_answer.py --backend http://127.0.0.1:8000 --expect-mode extractive
      - name: Watched inbox picks up a dropped file
        run: |
          mkdir -p inbox/contracts
          cp samples/inbox/software_license_agreement.txt inbox/contracts/
          python scripts/ci_check_answer.py --backend http://127.0.0.1:8000 --expect-document software_license_agreement.txt --wait 90
      - name: A scanned (image-only) PDF in the inbox is OCRed and indexed
        run: |
          mkdir -p inbox/real_estate
          cp samples/inbox/scanned_lease_amendment.pdf inbox/real_estate/
          python scripts/ci_check_answer.py --backend http://127.0.0.1:8000 --expect-document scanned_lease_amendment.pdf --wait 120
      - name: Start the local model (llm profile) and get a generated answer
        run: |
          docker compose --profile llm up -d llm
          python scripts/ci_check_answer.py --backend http://127.0.0.1:8000 --expect-mode generative --wait 900
      - name: Show logs on failure
        if: failure()
        run: docker compose --profile llm logs --tail 200
      - name: Stop stack
        if: always()
        run: docker compose --profile llm down -v
