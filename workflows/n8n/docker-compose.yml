# Self-hosted n8n for Local Legal AI automations (see workflows/n8n/README.md).
#   cp n8n.env.example n8n.env   # fill in the values
#   docker compose up -d
#   docker compose exec n8n n8n import:workflow --separate --input=/workflows
services:
  n8n:
    image: n8nio/n8n:1.123.0
    ports:
      - "127.0.0.1:5678:5678"
    env_file: n8n.env
    environment:
      # The workflows read their settings from $env and verify signatures with Node's crypto.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_RESTRICT_FILE_ACCESS_TO=/files/dropzone
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach the Local Legal AI API on the host
    volumes:
      - n8n_data:/home/node/.n8n
      - ./flows:/workflows:ro
      - ${DROPZONE_DIR:-./dropzone}:/files/dropzone
volumes:
  n8n_data:
