[client]
toolbarMode = "minimal"

[server]
# Matches the API limit (MAX_FILE_SIZE_MB) so oversized files are rejected before upload
maxUploadSize = 50

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#1e3a8a"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f5f9"
textColor = "#1f2937"
